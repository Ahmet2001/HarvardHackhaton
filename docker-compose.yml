services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.example
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BIODOCKX_GEMINI_MODEL: ${BIODOCKX_GEMINI_MODEL:-gemini-2.5-flash}
      BIODOCKX_ENABLE_GEMINI_AGENT: ${BIODOCKX_ENABLE_GEMINI_AGENT:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./jobs:/app/jobs

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BIODOCKX_API_URL: http://localhost:8000
    environment:
      - VITE_BIODOCKX_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
